# VAE architecture and training configuration
vae_arch:
  latent_dim: 128 # Latent vector dimensionality (pooled per sentence)
  embed_dim: 768 # Internal embedding dim (match encoder)
  num_layers: 4 # Transformer layers in VAE encoder/decoder
  num_heads: 8 # Attention heads per layer
  dropout: 0.1 # Dropout rate
  max_answer_len: 50 # Max answer sequence length
  num_latent_tokens: 8 # Pseudo-tokens for latent KV injection in decoder. Halved
  # from 16 → K*D = 8*128 = 1024 latent dims. SQuAD answers are 1-5 words, so 2048
  # dims was wildly over-capacity and trivially collapsed; smaller latent resists it.
  latent_pos_inject: true # Add a K-pooled projection of z to EVERY decoder token
  # input (not only the KV prefix). The causal decoder could otherwise reconstruct
  # short answers from teacher-forced tokens alone and ignore z → posterior collapse
  # (gen = "the the and", active_dims → 0). Per-position injection makes z reachable
  # at every step so it cannot be bypassed.
  use_bow_head: true # Bag-of-words head predicting the answer's token set from z
  # alone (Zhao et al. 2017). Trained via vae_training.bow_loss_weight; a decoder-
  # independent gradient that keeps the latent informative.

vae_training:
  learning_rate: 5.0e-4 # Peak learning rate for AdamW. 1e-4 was ~10x too low:
  # recon stuck ~20 (acc ~0.25) in controlled tests; at 5e-4 the decoder learns
  # to read the latent and recon drops sharply (acc >0.8). Warmup (500) stabilizes
  # the higher peak. Drop to 3e-4 if loss spikes at full 768-dim scale.
  batch_size: 64 # Samples per training batch
  epochs: 30 # Maximum training epochs
  patience: 5 # Early stopping patience (val checks)
  warmup_steps: 500 # LR warmup steps
  weight_decay: 0.01 # AdamW weight decay
  grad_clip_max_norm: 5.0 # Max gradient norm. 1.0 was far too aggressive for a
  # ~25M-param model dominated by the 30k×768 tied embedding: observed grad_norm
  # sat at ~15-20 the whole run, so clip-to-1.0 throttled the effective LR ~15-20x
  # and the model underfit (recon plateaued, F1/EM ~0). 5.0 lets real updates through.
  grad_accum_steps: 1 # Gradient accumulation steps
  beta_start: 0.01 # KL weight start (small positive avoids ignoring KL entirely)
  beta_end: 1.0 # KL weight end
  beta_warmup_steps: 10000 # Steps to linearly ramp beta (monotonic schedule only)
  beta_schedule: cyclical # "monotonic" or "cyclical" (Fu et al. 2019). Cyclical
  # repeatedly drops beta back to beta_start, giving the decoder periodic low-KL
  # windows to (re)learn to use z — a safeguard against the one-shot collapse seen
  # under the monotonic ramp (everything died ~step 900 as beta first crossed ~0.1).
  beta_cycles: 40 # Number of annealing cycles (cyclical only)
  beta_cycle_ratio: 0.5 # Fraction of each cycle spent ramping
  free_bits: 0.3 # Per-dim KL ALLOWANCE (target-rate VAE). 0.02 was the ROOT CAUSE
  # of the collapse — the KL penalty pinned the posterior at the floor before the
  # decoder learned to read z, so z stayed ~noise → decoder ignored it → gen "the
  # the the". Controlled sweep (reproducing regime): unique generations 0.02→7/128,
  # 0.1→52, 0.3→113, 0.5→122. 0.3 keeps the latent alive (true_kl ~K*D*0.3) without
  # KL running away. Watch train/true_kl — it must stay ABOVE the floor, not decay.
  ema_decay: 0.999 # EMA decay rate for validation weights
  target_kl: null # KL hinge disabled. A finite value (e.g. 320) drives total
  # KL toward ~0.15 nats/dim across 2048 dims — i.e. toward collapse. Rely on
  # β-warmup + free_bits to regulate KL instead.
  val_every_n_steps: 500 # Validate every N training steps
  noise_aug_sigma: 0.1 # Extra Gaussian std injected into z before decode (decoder noise robustness)
  noise_aug_prob: 0.5 # Probability of applying noise augmentation each step
  null_train_fraction: 0.10 # Keep only 10% NULL / 90% answerable in the VAE training set
  # (SQuAD v2 is ~33% null; the old balanced sampler inflated it to 50%). Export,
  # classifier and diffusion still use the FULL dataset — this only affects VAE training.
  null_loss_weight: 0.1 # Downweight NULL examples' reconstruction loss (answerable = 1.0)
  word_dropout: 0.5 # Prob of replacing each teacher-forced decoder INPUT token with
  # [MASK] during training (Bowman 2016). Forces decoder to use latent z instead of
  # copying the previous gold token — fixes latent bypass / posterior collapse
  # (recon was stuck ~33, true_kl falling, generation ~empty). Targets unchanged.
  # Raised 0.4 → 0.5 to lean harder on z alongside per-position injection + BoW.
  bow_loss_weight: 0.5 # Weight on the bag-of-words auxiliary loss (needs
  # vae_arch.use_bow_head). Forces z to encode which answer tokens appear,
  # independent of the autoregressive decoder. Same per-sequence-sum reduction as
  # recon, so 0.5 makes it ~half a reconstruction term. The primary collapse cure.

quality_gate:
  min_recon_accuracy: 0.85 # Min token-level reconstruction accuracy
  min_mean_kl: 1.0 # Min mean KL to avoid posterior collapse (K=8 sequence latent)
  min_active_dims: 32 # Min latent dims with variance > threshold (~3% of K*D = 8*128 = 1024)
  min_centroid_distance: 0.5 # Min L2 between answerable/unanswerable centroids
  active_dim_variance_threshold: 0.1 # Variance cutoff for "active" dimension
  max_dead_slots: 0 # Max latent slots with zero active dims (per-slot collapse)
  min_active_in_any_slot: 1 # Each of the K slots must have ≥ this many active dims
